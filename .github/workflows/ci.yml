# Nome da nossa automação
name: CI - Backend Nest.js

# Quando ela deve rodar? 
on:
  push:
    branches: [ main ] # Quando houver push nestas branches
  pull_request:
    branches: [ main ] # Quando um PR for aberto para a main
env:
  # Variáveis de ambiente necessárias para os testes
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
  IA_API_KEY: ${{ secrets.IA_API_KEY }}
  Database_URL: ${{ secrets.Database_URL }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ------------------------------------------------------------
# JOB 1: Testes e Validação do Código
# ------------------------------------------------------------
jobs:
  build-and-test:
    # O "computador" que o GitHub vai nos emprestar (Linux)
    runs-on: ubuntu-latest

    steps:
      # 1. Copia o código do seu repositório para a máquina do GitHub
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Instala o Node.js na versão correta
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Agiliza as próximas rodadas salvando o cache do npm

      # 3. Instala as dependências (Equivalente ao seu npm install)
      - name: Instalar Dependências
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # 4. Compila o código TypeScript
      - name: Compilar Código
        run: npm run build

      # 5. Verifica o Lint (Padronização de código)
      - name: Rodar Lint
        run: npm run lint

      # 6. Executa os Testes Unitários
      # Se um teste falhar, o deploy nem acontece!
      - name: Rodar Testes
        run: npm run test
        
  # ------------------------------------------------------------
  # JOB 2: Construir e Publicar a Imagem Docker
  # ------------------------------------------------------------       

  build-docker-and-publish:
    runs-on: ubuntu-latest
    needs: build-and-test # SÓ RODA SE OS TESTES PASSAREM!
    # Só envia para o Docker Hub em commits na main (evita rodar em Pull Requests abertos)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Corrigido o nome da tag eliminando o espaço antes de github.sha
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/automacao-de-pr-com-ia:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/automacao-de-pr-com-ia:${{ github.sha }}

  





